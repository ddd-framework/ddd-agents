framework:
    secret: '%env(APP_SECRET)%'
    test: true
    http_method_override: false
    property_info: { with_constructor_extractor: true }
    php_errors:
        log: true
    validation:
        email_validation_mode: html5
    router:
        utf8: true
        resource: '%kernel.project_dir%/config/symfony/default/routes.yaml'
